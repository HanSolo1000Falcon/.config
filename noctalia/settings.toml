[plugins]
enabled = [
    "yuuto/arch-updater",
    "noctalia/bongocat",
    "cleboost/jetbrains-provider",
    "yuuto/calculator",
    "nightwatch75/dns-switcher",
    "dotnetrob/cat",
    "alexander/screen-toolkit"
]

[shell]
polkit_agent = true

    [shell.greeter_sync]
    auto_sync = false
    privilege_command = "kitty -e pkexec"

    [shell.panel]
    transparency_mode = "glass"

    [shell.screenshot]
    directory = "/home/falcon1k/Pictures/Screenshots"

[wallpaper]
directory = "/home/falcon1k/.config/rice-pictures/Wallpapers/random"

    [wallpaper.automation]
