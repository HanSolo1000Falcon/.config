config_version = 13

[bar]
order = [ "default", "side" ]

    [bar.default]
    center = [ "clock" ]
    concave_edge_corners = true
    end = [ "audio_visualizer", "AudioVisualizerSpacer", "network_rx", "network_tx" ]
    margin_ends = 0
    position = "bottom"
    radius = 80
    radius_bottom_left = 0
    radius_bottom_right = 0
    scale = 2.0000000223517418
    start = [ "LeftMostSpacer", "battery", "media" ]

    [bar.side]
    background_opacity = 0.79999998211860657
    capsule_fill = "surface"
    capsule_thickness = 0.74999998696148396
    center = [ "workspaces" ]
    contact_shadow = true
    enabled = true
    end = [ "cat_4", "MiniSpacer", "tray", "MiniSpacer", "widget_3", "bar_2", "clipboard", "MiniSpacer", "launcher" ]
    margin_edge = 20
    margin_ends = 150
    position = "left"
    radius = 80
    scale = 2.0000000223517418
    start = [ "control-center", "group:g1", "cat_3" ]
    thickness = 64

        [bar.side.dead_zone.actions]
        middle = "settings-toggle"

        [[bar.side.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "on_primary"
        id = "g1"
        members = [ "bluetooth", "network" ]
        opacity = 1.0
        padding = 6.0
        widget_spacing = 4

