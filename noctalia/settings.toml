config_version = 13

[bar.default]
background_opacity = 0.99999997764825821
contact_shadow = true

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 144.0
    box_width = 2304.0
    cx = 1736.0
    cy = 104.0
    flip_y = true
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 3440.0
    rotation = 0.0
    type = "audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background = false
        bands = 48
        centered = false
        mirrored = true
        show_when_idle = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1720.0
    cy = 1258.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 3440.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = [
    "yuuto/arch-updater",
    "noctalia/bongocat",
    "cleboost/jetbrains-provider",
    "yuuto/calculator",
    "nightwatch75/dns-switcher",
    "dotnetrob/cat",
    "alexander/screen-toolkit"
]

[shell.greeter_sync]
auto_sync = false
privilege_command = "kitty -e pkexec"

[shell.panel]
transparency_mode = "glass"

[wallpaper]
directory = "/home/falcon1k/.config/rice-pictures/Wallpapers/random"

    [wallpaper.automation]
    enabled = true
    interval_seconds = 1200

    [wallpaper.default]
    path = "/home/falcon1k/.config/rice-pictures/Wallpapers/random/o6leq3rtjfif1.png"

    [wallpaper.last]
    path = "/home/falcon1k/.config/rice-pictures/Wallpapers/random/o6leq3rtjfif1.png"

    [wallpaper.monitors.DP-1]
    path = "/home/falcon1k/.config/rice-pictures/Wallpapers/random/o6leq3rtjfif1.png"