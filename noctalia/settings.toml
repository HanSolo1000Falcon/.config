[plugins]
enabled = [
    "yuuto/arch-updater",
    "noctalia/bongocat",
    "cleboost/jetbrains-provider",
    "yuuto/calculator",
    "nightwatch75/dns-switcher",
    "dotnetrob/cat",
    "alexander/screen-toolkit"
]

[shell]
polkit_agent = true

    [shell.greeter_sync]
    auto_sync = false
    privilege_command = "kitty -e pkexec"

    [shell.panel]
    transparency_mode = "glass"

    [shell.screenshot]
    directory = "/home/falcon1k/Pictures/Screenshots"

[theme]
mode = "dark"
wallpaper_scheme = "faithful"

[wallpaper]
directory = "/home/falcon1k/.config/rice-pictures/Wallpapers/random"

    [wallpaper.automation]
    enabled = true
    interval_seconds = 1200

    [wallpaper.default]
    path = "/home/falcon1k/.config/rice-pictures/Wallpapers/random/6e4ca65cn2ih1.jpeg"

    [wallpaper.last]
    path = "/home/falcon1k/.config/rice-pictures/Wallpapers/random/6e4ca65cn2ih1.jpeg"

    [wallpaper.monitors.DP-1]
    path = "/home/falcon1k/.config/rice-pictures/Wallpapers/random/6e4ca65cn2ih1.jpeg"

    [wallpaper.monitors.WL-1]
    path = "/home/falcon1k/.config/rice-pictures/Wallpapers/random/r2spobrzft2f1.png"

[widget.AudioVisualizerSpacer]
length = 200
type = "spacer"

[widget.LeftMostSpacer]
type = "spacer"

[widget.MiniSpacer]
length = 10
type = "spacer"

[widget.audio_visualizer]
bands = 32
interactive = false
show_when_idle = true
width = 100

[widget.bar_2]
type = "yuuto/calculator:bar"

[widget.cat_3]
type = "dotnetrob/cat:cat"

[widget.cat_4]
type = "noctalia/bongocat:cat"

[widget.clock]
format = "{:%H:%M:%S %Y-%m-%d}"

[widget.control-center]
capsule = true
capsule_fill = "on_primary"
capsule_padding = 4

[widget.launcher]
capsule = true
capsule_fill = "on_primary"
capsule_padding = 4
capsule_radius = "auto"

[widget.network]
show_label = false

[widget.sysmon]
visualization = "graph"

[widget.tray]
capsule = true
capsule_fill = "on_primary"
capsule_padding = 4
drawer = true

[widget.widget_3]
type = "yuuto/arch-updater:widget"

[widget.workspaces]
empty_color = "on_secondary"
focused_color = "on_primary"
hide_when_empty = false
occupied_color = "on_secondary"
urgent_color = "on_error"