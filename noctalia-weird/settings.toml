config_version = 12

[accessibility]
ui_scale = 1.5000000149011612

[bar.default]
background_opacity = 0.79999998211860657
center = [ "audio_visualizer", "media", "audio_visualizer" ]
concave_edge_corners = false
end = [ "cpu", "temp", "ram", "spacer_4", "battery", "control-center" ]
font_family = "ComicShannsMono Nerd Font"
margin_edge = 8
scale = 1.7000000178813934
start = [ "workspaces", "spacer_2", "clock", "spacer_3", "weather" ]
thickness = 40
widget_spacing = 10

    [bar.default.dead_zone.actions]
    middle = "settings-toggle"

[location]
auto_locate = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@DP-1",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000002",
    "lockscreen-widget-0000000000000003"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1720.0
    cy = 1258.0
    output = "DP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 480.0
    box_width = 480.0
    cx = 1720.0
    cy = 720.0
    output = "DP-1"
    rotation = 0.0
    type = "fancy_audio_visualizer"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 0.0
    box_width = 0.0
    cx = 1720.0
    cy = 329.0
    output = "DP-1"
    rotation = 0.0
    type = "media_player"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000003]
    box_height = 128.0
    box_width = 272.0
    cx = 1720.0
    cy = 1040.0
    output = "DP-1"
    rotation = 0.0
    type = "weather"

[shell]
avatar_path = "/home/falcon1k/.config/rice-pictures/ProfilePicture.png"
font_family = "ComicShannsMono Nerd Font"
niri_overview_type_to_launch_enabled = true
password_style = "random"
show_location = false

    [shell.launcher]
    app_grid = true

[theme]
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "foot", "niri" ]

[wallpaper]
directory = "~/.config/rice-pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/falcon1k/.config/rice-pictures/Wallpapers/Ultrawide/Idontknow.png"

    [wallpaper.last]
    path = "/home/falcon1k/.config/rice-pictures/Wallpapers/Ultrawide/Idontknow.png"

    [wallpaper.monitors.DP-1]
    path = "/home/falcon1k/.config/rice-pictures/Wallpapers/Ultrawide/Idontknow.png"

[widget.audio_visualizer]
color_1 = "secondary"
scale = 2.5

[widget.clock]
format = "{:%H:%M:%S %d/%m/%Y}"

[widget.media]
anchor = true
artist_first = true
hide_when_no_media = true
max_length = 800

[widget.spacer_2]
type = "spacer"

[widget.spacer_3]
type = "spacer"

[widget.spacer_4]
type = "spacer"

[widget.workspaces]
hide_when_empty = true
show_labels = false
style = "focus_hint"